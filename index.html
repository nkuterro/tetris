<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="styles.css?v=20260901-20" />
  </head>
  <body>
    <main id="menu-screen" class="menu-screen" hidden>
      <div class="menu-card">
        <p class="eyebrow">PAUSED</p>
        <h1>Tetris</h1>
        <p class="menu-description">ゲームを一時停止しています。</p>
        <button id="menu-start-btn" type="button">Resume</button>
        <div class="audio-settings">
          <div class="setting-heading">
            <span>Sound</span>
            <button id="sound-btn" class="sound-btn" type="button">ON</button>
          </div>
          <label class="volume-control" for="volume-slider">
            <span>Volume</span>
            <output id="volume-value" for="volume-slider">100%</output>
          </label>
          <input id="volume-slider" type="range" min="0" max="150" value="100" />
        </div>
        <p class="menu-hint">PC: Arrow keys / Space &nbsp;|&nbsp; Mobile: touch buttons</p>
      </div>
    </main>

    <div class="game-shell">
      <div class="hold-side card preview-card">
        <h2>Hold</h2>
        <canvas id="hold" width="120" height="120" aria-label="Hold piece preview"></canvas>
      </div>

      <div class="game-column">
        <div class="panel">
          <canvas id="game" width="300" height="600" aria-label="Tetris game board"></canvas>
        </div>

        <div class="touch-controls" aria-label="Touch controls">
          <button type="button" class="touch-btn dpad-up" data-action="drop">▲</button>
          <button type="button" class="touch-btn dpad-left" data-action="left">◀</button>
          <button type="button" class="touch-btn dpad-right" data-action="right">▶</button>
          <button type="button" class="touch-btn dpad-down" data-action="down">▼</button>
          <button type="button" class="touch-btn action-rotate" data-action="rotate">⟳</button>
          <button type="button" class="touch-btn action-hold" data-action="hold">Hold</button>
        </div>
      </div>

      <aside class="sidebar">
        <div class="card">
          <h1>Tetris</h1>
          <div class="stats">
            <div><span>Score</span><strong id="score">0</strong></div>
            <div><span>Lines</span><strong id="lines">0</strong></div>
            <div><span>Level</span><strong id="level">1</strong></div>
          </div>
        </div>

        <div class="card preview-card">
          <h2>Next</h2>
          <canvas id="next" width="120" height="120" aria-label="Next piece preview"></canvas>
        </div>

        <div class="card controls-card">
          <div class="quick-actions">
            <button type="button" class="quick-btn" data-action="pause">Pause</button>
          </div>
          <h2>Controls</h2>
          <ul>
            <li>← → : move</li>
            <li>↓ : soft drop</li>
            <li>Space : rotate</li>
            <li>↑ : hard drop</li>
            <li>C : hold</li>
            <li>P : pause</li>
          </ul>
          <button id="start-btn" type="button">Start / Restart</button>
        </div>
      </aside>
    </div>

    <script src="audio.js?v=20260901-20"></script>
    <script src="app.js?v=20260901-20"></script>
  </body>
</html>
